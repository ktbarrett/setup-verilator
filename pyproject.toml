[project]
name = "setup-verilator"
version = "0.1.0"
description = "Install Verilator in GitHub Actions from prebuilt packages or source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyGithub",
    "requests",
    "pydantic>=2,<3",
]
authors = [
    {name = "Kaleb Barrett", email = "dev.ktbarrett@gmail.com"},
]
maintainers = [
    {name = "Kaleb Barrett", email = "dev.ktbarrett@gmail.com"},
]

[dependency-groups]
dev = [
    "pytest",
    "responses",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
