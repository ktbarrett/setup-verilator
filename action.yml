name: Install Verilator
description: Install a Verilator release, nightly, or master, building from source when no binary is available.
author: ktbarrett
branding:
  icon: cpu
  color: blue

inputs:
  version:
    description: Verilator version (for example, v5.048 or 5.048), nightly, or master
    required: true
  token:
    description: GitHub token used for metadata and downloads
    default: ${{ github.token }}
  install-dependencies:
    description: Install missing runtime tools and source build dependencies using apt or Homebrew
    default: 'true'
  force-source:
    description: Build from source even when a binary is available
    default: 'false'
  jobs:
    description: Number of parallel jobs when building from source
    default: '2'

outputs:
  version:
    description: Installed upstream version, including the v prefix
    value: ${{ steps.install.outputs.version }}
  path:
    description: Installation prefix
    value: ${{ steps.install.outputs.path }}
  source-sha:
    description: Full upstream commit used by the installation
    value: ${{ steps.install.outputs.source-sha }}
  built-from-source:
    description: Whether Verilator was built from source (true or false)
    value: ${{ steps.install.outputs.built-from-source }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        python -m pip install uv
        uv pip install --python "$(command -v python)" --requirements pyproject.toml
    - name: Install Verilator
      id: install
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INSTALL_VERSION: ${{ inputs.version }}
        INSTALL_TOKEN: ${{ inputs.token }}
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        INSTALL_FORCE_SOURCE: ${{ inputs.force-source }}
        INSTALL_JOBS: ${{ inputs.jobs }}
      run: python -m tools.install
